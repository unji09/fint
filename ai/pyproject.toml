[project]
name = "fint-ai"
version = "0.1.0"
description = "F!NT AI Service — stateless FastAPI server for LLM, STT, and NLP processing"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.0",
    "httpx>=0.27.0",
    "openai>=1.0",
    "anthropic>=0.30.0",
    "instructor>=1.0",
    "boto3>=1.35.0",
    "python-jose[cryptography]>=3.3",
    "onnxruntime>=1.18",
    "tokenizers>=0.21",
    "huggingface-hub>=0.23",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "types-python-jose>=3.3",
    "boto3-stubs>=1.35",
]
batch = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real_gpu'"
markers = [
    "real_gpu: 실제 GPU 서버가 필요한 E2E 테스트 (GPU_SERVER_URL 환경변수 필요)",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
