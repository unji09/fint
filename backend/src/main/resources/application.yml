spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fint
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    # Spring Boot 4는 Jackson 3을 기본으로 사용. 마이그레이션 안정성을 위해 Jackson 2 디폴트 유지.
    # Jackson 3 디폴트로 전환할 준비가 되면 false로 변경.
    use-jackson2-defaults: true
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Actuator (health/info만 공개, 나머지는 기본값대로 비공개)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
