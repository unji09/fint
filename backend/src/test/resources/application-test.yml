spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fint_test
    username: fint
    password: fint
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    clean-disabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-unit-tests-only-change-me
  access-expiration: 3600000
  refresh-expiration: 1209600000

ai:
  server-url: http://localhost:8000

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
