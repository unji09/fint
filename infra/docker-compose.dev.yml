# F!NT EC2 배포용 Docker Compose
#
# 기동 대상:
#   - Nginx        (리버스 프록시, 단일 진입점)
#   - Spring       (백엔드 API)
#   - frontend-web (Next.js)
#   - PostgreSQL   (메인 DB)
#   - Redis        (캐시 / 큐)
#
# 전체 서비스 기본 포함 (AI 포함)
#
# 사용법:
#   cp .env.dev.example .env.dev
#   # .env.dev 값 채우기
#   docker compose -f docker-compose.dev.yml --env-file ../.env.dev up -d

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fint-nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt/live/k14a301.p.ssafy.io/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/k14a301.p.ssafy.io/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /etc/letsencrypt/archive/k14a301.p.ssafy.io:/etc/letsencrypt/archive/k14a301.p.ssafy.io:ro
    depends_on:
      spring:
        condition: service_healthy
      frontend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    networks:
      - app

  spring:
    image: fint-backend:latest
    container_name: fint-spring
    restart: unless-stopped
    env_file: ../.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 4g
    networks:
      - app

  postgres:
    image: pgvector/pgvector:pg16
    container_name: fint-postgres
    restart: unless-stopped
    env_file: ../.env.dev
    environment:
      TZ: Asia/Seoul
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fint}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: fint-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    networks:
      - app

  frontend-web:
    image: fint-frontend:latest
    container_name: fint-frontend
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      # alpine 의 localhost 는 IPv6 ::1 우선이라 connection refused → 127.0.0.1 명시
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks:
      - app

  ai:
    image: fint-ai:latest
    container_name: fint-ai
    restart: unless-stopped
    env_file: ../.env.dev
    expose:
      - "8000"
    volumes:
      - ai-model:/app/model
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    networks:
      - app

networks:
  app:
    name: fint-app
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ai-model:
