# F!NT EC2 배포용 Docker Compose
#
# 기동 대상:
#   - Nginx     (리버스 프록시, 단일 진입점)
#   - Spring    (백엔드 API)
#   - PostgreSQL (메인 DB)
#   - Redis     (캐시 / 큐)
#
# 아직 준비 안 된 서비스 (frontend-web, ai):
#   profiles: ["full"]로 선언. 준비되면 --profile full 로 포함.
#
# 사용법:
#   cp .env.dev.example .env.dev
#   # .env.dev 값 채우기
#   docker compose -f docker-compose.dev.yml --env-file ../.env.dev up -d

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fint-nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt/live/k14a301.p.ssafy.io/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/k14a301.p.ssafy.io/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /etc/letsencrypt/archive/k14a301.p.ssafy.io:/etc/letsencrypt/archive/k14a301.p.ssafy.io:ro
    depends_on:
      spring:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    networks:
      - app

  spring:
    image: fint-backend:latest
    container_name: fint-spring
    restart: unless-stopped
    env_file: ../.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 4g
    networks:
      - app

  postgres:
    image: postgres:16
    container_name: fint-postgres
    restart: unless-stopped
    env_file: ../.env.dev
    environment:
      TZ: Asia/Seoul
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fint}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: fint-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    networks:
      - app

  # --- 아직 준비 안 된 서비스 (--profile full 로 활성화) ---

  frontend-web:
    image: fint-frontend:latest
    container_name: fint-frontend
    restart: unless-stopped
    expose:
      - "3000"
    mem_limit: 512m
    networks:
      - app
    profiles:
      - full

  ai:
    image: fint-ai:latest
    container_name: fint-ai
    restart: unless-stopped
    env_file: ../.env.dev
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    networks:
      - app
    profiles:
      - full

networks:
  app:
    name: fint-app
    driver: bridge

volumes:
  postgres-data:
  redis-data:
