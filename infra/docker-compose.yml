# F!NT 앱 데이터 스택 (로컬 개발용)
#
# 기동 대상:
#   - PostgreSQL 16 (메인 DB)
#   - Redis 7       (세션 / 캐시 / 비동기 큐)
#   - FastAPI        (AI 서비스)
#
# 포함되지 않음:
#   - Spring Boot (로컬에선 호스트에서 ./gradlew bootRun 으로 실행)
#   - 모니터링 스택 (infra/monitoring/docker-compose.yml 별도)
#
# 사용법은 infra/README.md 참조.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fint}
      POSTGRES_DB: ${POSTGRES_DB:-fint_local}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fint}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: fint-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    networks:
      - app

  ai:
    build: ../ai
    container_name: fint-ai
    restart: unless-stopped
    env_file: ../.env.local
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ai-model:/app/model
      - ../ai/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    networks:
      - app

networks:
  app:
    name: fint-app
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  ai-model:
